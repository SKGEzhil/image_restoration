# Training configuration for src/train.py.
# All values are optional; anything omitted falls back to train.py defaults.

# ─── SCUNet paper replication notes ───────────────────────────────────
# Standard SCUNet (same-size denoising):
#   train_model: scunet
#   loss_config.preset: scunet_l1
# SCUNet-real (practical blind denoising, heavier config):
#   train_model: scunet_real
#   loss_config.preset: scunet_l1
# SCUNetSR (super-resolution 128x128 -> 256x256):
#   train_model: scunet_sr
#   loss_config.preset: scunet_l1
# SCUNetSR-real (heavier SR variant):
#   train_model: scunet_sr_real
#   loss_config.preset: scunet_l1
# SCUNetG (GAN-trained for perceptual quality):
#   train_model: scunet_sr
#   gan_training.enabled: true
#   loss_config.preset: scunet_gan
#   gan_training.pretrain_epochs: N  # epochs of L1-only pretraining
# Paper settings (synthetic Gaussian denoising):
#   lr: 0.0001, batch_size: 24, patch_size: 128, loss: L1 only
#   scheduler: step decay x0.5 every 200k iters (ends at 3.125e-6)
#   (Use scheduler.type: step with step_size: 200000, gamma: 0.5)
# ──────────────────────────────────────────────────────────────────────

train_model: scunet_sr        # model to train (key in models: registry)

models:                    # model definitions — add new models here
  nafnet:
    width: 32
    num_blks: 8
    drop_out_rate: 0.0

  # SCUNet (same-size denoising) — paper standard config
  scunet:
    in_nc: 1
    config: [2, 2, 2, 2, 2, 2, 2]
    dim: 64
    drop_path_rate: 0.0
    input_resolution: 128

  # SCUNet-real (heavier config for practical blind denoising)
  scunet_real:
    in_nc: 1
    config: [4, 4, 4, 4, 4, 4, 4]
    dim: 64
    drop_path_rate: 0.0
    input_resolution: 128

  # SCUNetSR (super-resolution variant, 128 -> 256)
  scunet_sr:
    in_nc: 1
    config: [2, 2, 2, 2, 2, 2, 2]
    dim: 64
    drop_path_rate: 0.0
    input_resolution: 128
    up_scale: 2

  # SCUNetSR-real (heavier SR variant)
  scunet_sr_real:
    in_nc: 1
    config: [4, 4, 4, 4, 4, 4, 4]
    dim: 64
    drop_path_rate: 0.0
    input_resolution: 128
    up_scale: 2

data_dir: data             # paired dataset root (NoisyLR + GT subdirs per split)
epochs: 40
batch_size: 12
lr: 0.0001
val_every: 100             # run validation every N training steps
wandb_log_step: 100         # log metrics to wandb every N steps (0 disables wandb)

# ─── Scheduler configuration ──────────────────────────────────────────
# "cosine"  -> CosineAnnealingLR (default, current behavior)
# "step"    -> StepLR with configurable step_size and gamma
scheduler:
  type: step             # "cosine" | "step"
  step_size: 200000        # for step scheduler: decay every N steps
  gamma: 0.5               # for step scheduler: LR multiplier

# ─── GAN training configuration ───────────────────────────────────────
# Set enabled: true to activate adversarial training (SCUNetG mode).
# WARNING: GAN training is fragile. Without pretraining the generator
# will likely collapse (random noise output). Follow these rules:
#   1. ALWAYS pretrain with L1/DISTS only (pretrain_epochs >= 10)
#   2. Keep adversarial weight tiny (adv: 0.005 - 0.01)
#   3. Update D less often than G (discriminator_update_freq: 2 - 5)
#   4. Enable feature_matching for dense gradient signal to G
#   5. If D still overpowers G, increase d_grad_clip or lower ndf
gan_training:
  enabled: false

  # Discriminator architecture
  discriminator:
    ndf: 64                # base channels (lower = weaker D, more stable)
    n_layers: 3
    use_spectral_norm: true

  # Loss weights — adv must be MUCH smaller than pixel loss weight
  loss_weights:
    adv: 0.005             # adversarial (keep tiny: 0.001-0.01)
    fm: 1.0                # feature matching on D intermediate layers

  # Number of epochs to pretrain with pixel loss only before
  # activating the adversarial component.
  # STRONGLY RECOMMENDED: >= 10 epochs (paper uses hundreds of k iters)
  pretrain_epochs: 10

  # Linear warmup: ramp adversarial weight from 0 -> target over N epochs
  # after pretraining ends. 0 = no warmup.
  adv_warmup_epochs: 5

  # Update discriminator every N training steps (G updated every step).
  # Higher values prevent D from overpowering G.
  discriminator_update_freq: 2

  # D optimizer LR
  discriminator_lr: 0.0001

  # Gradient clipping max norm for D (0 = disabled). Prevents exploding D
  # gradients that can destabilize the whole GAN.
  d_grad_clip: 1.0

  # Use soft labels (0.9 / 0.1) instead of hard (1.0 / 0.0) for D.
  # Prevents D from becoming over-confident too quickly.
  use_soft_labels: true

  # Enable feature-matching loss: generator matches D's intermediate layer
  # features of real images. Provides dense, stable gradients to G.
  feature_matching: true

# ─── Loss configuration ───────────────────────────────────────────────
# Quick switch via preset, or define custom loss below.
# Presets: l1, l1_ssim, legacy, combo_1, combo_2, combo_3, combo_4,
#          scunet_l1, scunet_gan
# "legacy" = old default: 0.5*L1 + 0.5*SSIM + 0.05*FFT
loss_config:
  preset: scunet_l1 #only calculates L1 loss

  # Manual config (used if preset is null)
  mode: additive              # "additive" | "geometric" | "uncertainty"
  geometric_terms: [charbonnier, ms_ssim]   # for geometric mode — auto-normalized
  uncertainty_terms: [charbonnier, ms_ssim, gradient, ffl]  # for uncertainty mode
  uncertainty_init_sigma: 1.0

  losses:
    l1:
      enabled: true
      weight: 1.0

    ssim:
      enabled: true
      weight: 0.2
      window_size: 11

    charbonnier:
      enabled: false
      weight: 1.0
      epsilon: 1e-3

    ms_ssim:
      enabled: false
      weight: 0.2
      compensation: 1.0

    gradient:
      enabled: false
      weight: 0.1
      kernel: sobel              # "sobel" | "laplacian"

    log_l1:
      enabled: false
      weight: 0.3
      epsilon: 1e-6

    ffl:
      enabled: false
      weight: 0.1
      alpha: 1.0
      ramp_epochs: 15           # linear ramp 0→weight over first N epochs

    tv:
      enabled: false
      weight: 1e-4

    fft:
      enabled: false
      weight: 0.05

    laplacian:
      enabled: false
      weight: 0.1

    dists:
      enabled: false
      weight: 0.05

# ─── Training settings ────────────────────────────────────────────────
num_workers: 0
seed: 42
run_name: null             # run id (default: timestamp); also the wandb run name
resume: null               # path to a last.pt to resume from
exclude_samples: "/Users/skgezhil/Projects/AI_ML/Image_Restoration/src/data_processing/filtering/exp_02/outputs/exclude_list.json"      # path to filtered_samples.json to exclude degraded GT (null = use all)
include_augmented_data: false   # include synthetic augmented samples in training
augmentation_offset: 3200      # files >= this offset are augmented (e.g., 003200.npy)
