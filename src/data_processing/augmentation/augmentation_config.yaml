# Augmentation Configuration
# ==========================

# Sampling
num_augmented_samples: 2500
sampling_with_replacement: true
seed: 42

# Numbering offset (first synthetic sample starts at this index)
offset: 3200

# Exclusion list (optional) - skip these GT samples during augmentation
# Format: {"excluded": ["000142.npy", "000831.npy", ...]}
exclude: ../filtering/exp_02/outputs/exclude_list.json  # Set to path like "exclude_list.json" relative to this config

# Source data
data_dir: ../../data
split: train

# Noise parameters
gaussian_sigma_range: [0.05, 0.12]
speckle_sigma_range: [0.15, 0.28]
blur_sigma_range: [0.2, 1.5]

# 18 Augmentation recipes
recipes:
  - id: 1
    kernel: bicubic
    noise: both
    order: pre
    percentage: 27.37

  - id: 2
    kernel: bicubic
    noise: both
    order: post
    percentage: 41.73

  - id: 3
    kernel: bilinear
    noise: both
    order: pre
    percentage: 6.50

  - id: 4
    kernel: bilinear
    noise: both
    order: post
    percentage: 9.90

  - id: 5
    kernel: gaussian-decimate
    noise: both
    order: pre
    percentage: 5.73

  - id: 6
    kernel: gaussian-decimate
    noise: both
    order: post
    percentage: 8.77
